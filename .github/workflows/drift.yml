#
# Toolchain drift check: compare the pinned TOOLCHAIN_VERSION with the tag
# dl.xiom-lang.org/latest.json advertises, and fail the job on any mismatch
# so a release is never silently missed.
#
# - latest == pin: nothing to do.
# - latest >  pin: a released toolchain is not absorbed yet. Type-check the
#   lessons against it as evidence, then fail with the absorption steps.
# - latest <  pin: the mirror index (latest.json) is behind the repo pin.
#   Deploys follow the pin (option C), so the container is unaffected, but
#   the website and other index consumers are stale. Never fetch the older
#   toolchain; fail so the index gets refreshed.
#
# Adoption stays manual on purpose: every release needs a lesson sweep, an
# execution audit and a baseline refresh (SESSION.md section 3.1), so this
# workflow signals only.
name: Toolchain drift

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve latest release and compare with the pin
        id: latest
        run: |
          TAG=$(curl -fsSL https://dl.xiom-lang.org/latest.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).tag))")
          PIN=$(tr -d '\r\n ' < TOOLCHAIN_VERSION)
          RELATION=$(node -e "const f=v=>v.replace(/^v/,'').split(/[.-]/).slice(0,3).map(x=>parseInt(x,10)||0); const [a,b]=process.argv.slice(1).map(f); for (let i=0;i<3;i++){ if (a[i]!==b[i]) { console.log(a[i]>b[i]?'newer':'older'); process.exit(0);} } console.log('same');" "$TAG" "$PIN")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "relation=$RELATION" >> "$GITHUB_OUTPUT"
          echo "latest=$TAG pinned=$PIN relation=$RELATION"
          {
            echo "## Toolchain drift"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| mirror latest.json | \`$TAG\` |"
            echo "| repository pin | \`$PIN\` |"
            echo "| relation | \`$RELATION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch latest toolchain (preview)
        if: steps.latest.outputs.relation == 'newer'
        env:
          TOOLCHAIN_TAG: ${{ steps.latest.outputs.tag }}
        run: bash tools/fetch-toolchain.sh

      - name: Type-check lessons against the latest toolchain (preview)
        if: steps.latest.outputs.relation == 'newer'
        run: node tools/lesson-audit.js --check-only --quiet --fail-on-failures

      - name: Drift summary
        if: steps.latest.outputs.relation == 'same'
        run: echo "Pinned toolchain is the latest release (${{ steps.latest.outputs.pin }}); nothing to do."

      - name: Fail on toolchain drift
        if: always() && (steps.latest.outputs.relation == 'newer' || steps.latest.outputs.relation == 'older')
        run: |
          if [ "${{ steps.latest.outputs.relation }}" = "newer" ]; then
            echo "::error::Toolchain drift: ${{ steps.latest.outputs.tag }} is newer than the repo pin ${{ steps.latest.outputs.pin }}. Absorb the release (SESSION.md section 3.1): bump TOOLCHAIN_VERSION, re-run the sweep and the execution audit, refresh baseline/limitations/stdlib-ref, then commit and push."
          else
            echo "::error::Toolchain drift: latest.json advertises ${{ steps.latest.outputs.tag }} but the repo pin is ${{ steps.latest.outputs.pin }}. Deploys follow the repo pin (option C), so the container is unaffected; refresh the mirror index for the website and other consumers (dl-deploy.sh pull/cron on the VPS)."
          fi
          exit 1
