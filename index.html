<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIOM Playground v0.49.9</title>
<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <span class="logo">XIOM</span>
      <span class="version">v0.49.9</span>
    </div>
    <nav class="header-nav">
      <button id="btnLessons" class="nav-btn">Lessons</button>
      <button id="btnRun" class="nav-btn run-btn" onclick="compile()">Run ▸</button>
    </nav>
  </header>

  <div class="main-layout">
    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-header">Lessons</div>
      <div id="lessonList" class="lesson-list"></div>
    </aside>

    <div class="content">
      <div id="narrativePanel" class="narrative-panel hidden">
        <div id="narrativeContent" class="narrative-content"></div>
      </div>

      <div id="editorContainer" class="editor-container"></div>

      <div class="output-panel">
        <div class="output-tabs">
          <button class="tab active" data-tab="output">Output</button>
          <button class="tab" data-tab="ir">LLVM IR</button>
          <button class="tab" data-tab="diag">Diagnostics</button>
          <button class="tab" data-tab="tokens">Tokens</button>
          <button class="tab" data-tab="contracts">Contracts</button>
        </div>
        <div id="outputContent" class="output-content">
          <pre id="output">Press Run ▸ or Ctrl+Enter to compile.</pre>
          <pre id="ir" class="hidden"></pre>
          <div id="diag" class="hidden"></div>
          <pre id="tokens" class="hidden"></pre>
          <pre id="contracts" class="hidden"></pre>
        </div>
      </div>

      <div id="status" class="status-bar">Ready. v0.49.9 — 930 tests</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
<script src="js/compiler.js"></script>
</body>
</html>
