<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIOM Playground v0.49.9</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
.header { background: #16213e; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 16px; color: #e94560; }
.header span { font-size: 11px; color: #888; }
.toolbar { background: #16213e; padding: 6px 20px; display: flex; gap: 8px; border-bottom: 1px solid #0f3460; flex-wrap: wrap; }
.toolbar button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a1a5e; padding: 6px 14px; cursor: pointer; font-family: inherit; font-size: 12px; border-radius: 4px; }
.toolbar button:hover { background: #1a1a6e; }
.toolbar button.compile { background: #e94560; border-color: #e94560; font-weight: bold; }
.toolbar button.compile:hover { background: #ff6b81; }
.main { display: flex; flex: 1; overflow: hidden; }
.editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #0f3460; }
.editor-panel label { padding: 6px 12px; background: #16213e; font-size: 11px; color: #888; text-transform: uppercase; display: flex; justify-content: space-between; }
.editor-panel label .line-count { color: #666; }
.editor-panel textarea { flex: 1; background: #0f0f23; color: #c0c0e0; border: none; padding: 12px 16px; font-family: inherit; font-size: 13px; line-height: 1.6; resize: none; outline: none; tab-size: 2; }
.output-panel { flex: 1; display: flex; flex-direction: column; }
.output-tabs { display: flex; background: #16213e; border-bottom: 1px solid #0f3460; }
.output-tabs button { flex: 1; padding: 6px 10px; border: none; background: transparent; color: #888; cursor: pointer; font-family: inherit; font-size: 11px; text-transform: uppercase; }
.output-tabs button.active { color: #e94560; border-bottom: 2px solid #e94560; }
.output-content { flex: 1; overflow: auto; padding: 12px; background: #0f0f23; }
.output-content pre { margin: 0; font-family: inherit; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
.diag-item { padding: 6px 10px; margin: 2px 0; border-radius: 4px; font-size: 12px; }
.diag-error { background: #3d0000; border-left: 3px solid #e94560; color: #ff8a98; }
.diag-warn { background: #3d3000; border-left: 3px solid #ffd700; color: #ffd700; }
.ir-line { color: #8be9fd; }
.ir-keyword { color: #ff79c6; }
.ir-type { color: #50fa7b; }
.ir-number { color: #bd93f9; }
.status { padding: 6px 20px; background: #16213e; border-top: 1px solid #0f3460; font-size: 11px; }
.status.ok { color: #4ecca3; }
.status.err { color: #e94560; }
.status.busy { color: #ffd700; }
</style>
</head>
<body>
<div class="header">
  <h1>XIOM Playground <span>v0.49.9</span></h1>
  <span>Industrial systems programming language — 930 tests</span>
</div>
<div class="toolbar">
  <button class="compile" onclick="compile()">Compile (Ctrl+Enter)</button>
  <button onclick="clearAll()">Clear</button>
  <select id="examples" onchange="loadExample(this.value)" style="background:#0f3460;color:#e0e0e0;border:1px solid #1a1a5e;padding:6px;font-family:inherit;font-size:12px;border-radius:4px;">
    <option value="">Examples...</option>
    <option value="hello">Hello World</option>
    <option value="fib">Fibonacci</option>
    <option value="struct">Structs + Methods</option>
    <option value="contract">Contracts</option>
    <option value="option">Option + if let</option>
    <option value="vec">Vec + for loop</option>
  </select>
</div>
<div class="main">
  <div class="editor-panel">
    <label>XIOM Source (.xi) <span class="line-count" id="lineCount">Ln 1, Col 1</span></label>
    <textarea id="editor" spellcheck="false" oninput="updateLineCount()" onkeydown="handleKeyDown(event)">fn main() -> Int {
  return 42;
}</textarea>
  </div>
  <div class="output-panel">
    <div class="output-tabs">
      <button class="active" onclick="showTab('output')">Output</button>
      <button onclick="showTab('ir')">LLVM IR</button>
      <button onclick="showTab('diag')">Diagnostics</button>
    </div>
    <div class="output-content" id="outputTab">
      <pre id="output">Click <b>Compile</b> or press Ctrl+Enter to compile.</pre>
      <pre id="ir" style="display:none"></pre>
      <div id="diag" style="display:none"></div>
    </div>
  </div>
</div>
<div class="status" id="status">Ready. v0.49.9 — 930 tests</div>

<script>
let currentTab = 'output';

function updateLineCount() {
  const editor = document.getElementById('editor');
  const lines = editor.value.substring(0, editor.selectionStart).split('\n');
  document.getElementById('lineCount').textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
}

function handleKeyDown(e) {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); compile(); }
  updateLineCount();
}

function showTab(tab) {
  document.getElementById('output').style.display = tab === 'output' ? 'block' : 'none';
  document.getElementById('ir').style.display = tab === 'ir' ? 'block' : 'none';
  document.getElementById('diag').style.display = tab === 'diag' ? 'block' : 'none';
  document.querySelectorAll('.output-tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  currentTab = tab;
}

async function compile() {
  const source = document.getElementById('editor').value;
  const status = document.getElementById('status');
  status.textContent = 'Compiling...';
  status.className = 'status busy';

  try {
    const resp = await fetch('/api/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source })
    });
    const result = await resp.json();

    // Output tab
    const output = document.getElementById('output');
    if (result.success) {
      output.innerHTML = '<span style="color:#4ecca3">Compilation successful!</span>';
      status.textContent = 'Compiled successfully.';
      status.className = 'status ok';
    } else {
      let html = '<span style="color:#e94560">Compilation failed:</span>';
      for (const d of (result.diagnostics || [])) {
        html += `\n  [${d.code}] line ${d.line}:${d.col}: ${d.message}`;
      }
      output.innerHTML = html;
      status.textContent = `Failed: ${(result.diagnostics||[]).length} error(s)`;
      status.className = 'status err';
    }

    // IR tab
    const irEl = document.getElementById('ir');
    if (result.ir) {
      irEl.innerHTML = spanIR(result.ir.substring(0, 10000));
    } else {
      irEl.innerHTML = '<span style="color:#666">No IR — compilation failed or not emitted.</span>';
    }

    // Diagnostics tab
    const diagEl = document.getElementById('diag');
    if (result.diagnostics && result.diagnostics.length > 0) {
      diagEl.innerHTML = result.diagnostics.map(d =>
        `<div class="diag-item diag-error"><b>[${d.code}]</b> line ${d.line}:${d.col} — ${d.message}</div>`
      ).join('');
    } else {
      diagEl.innerHTML = '<span style="color:#4ecca3">No diagnostics — clean compilation.</span>';
    }

  } catch(e) {
    document.getElementById('output').innerHTML = '<span style="color:#e94560">Error: ' + e.message + '</span>';
    status.textContent = 'Cannot reach compile server. Run: python server.py';
    status.className = 'status err';
  }
}

function spanIR(ir) {
  return ir
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\b(define|declare|ret|br|call|load|store|alloca|getelementptr|icmp|fcmp|add|sub|mul|sdiv|srem|zext|sext|bitcast|inttoptr|ptrtoint|unreachable|switch|phi|select)\b/g, '<span class="ir-keyword">$1</span>')
    .replace(/\b(i64|i32|i8|double|float|void|i1)\b/g, '<span class="ir-type">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="ir-number">$1</span>')
    .replace(/\b(%\w+)\b/g, '<span class="ir-line">$1</span>');
}

function clearAll() {
  document.getElementById('output').innerHTML = '';
  document.getElementById('ir').innerHTML = '';
  document.getElementById('diag').innerHTML = '';
  document.getElementById('status').textContent = 'Ready.';
  document.getElementById('status').className = 'status';
}

function loadExample(name) {
  if (!name) return;
  document.getElementById('examples').value = '';
  const examples = {
    hello: `fn main() -> Int {\n  return 42;\n}`,
    fib: `fn fib(n: Int) -> Int {\n  if n <= 1 { return n; }\n  return fib(n - 1) + fib(n - 2);\n}\n\nfn main() -> Int {\n  return fib(10);\n}`,
    struct: `type Point = {\n  x: Float64;\n  y: Float64;\n} derive[Eq, Clone]\n\npub fn Point.length() -> Float64 {\n  var sq = x * x + y * y;\n  return math.sqrt(sq);\n}\n\nfn main() -> Int {\n  var p = Point { x: 3.0; y: 4.0; };\n  return 0;\n}`,
    contract: `fn divide(a: Float64, b: Float64) -> Float64\n  requires: b != 0.0\n  ensures: result * b == a\n{\n  return a / b;\n}\n\nfn main() -> Int {\n  var result = divide(10.0, 2.0);\n  return 0;\n}`,
    option: `fn main() -> Int {\n  var x: Option[Int] = Some(42);\n  if let Some(v) = x { return v; }\n  return 0;\n}`,
    vec: `fn main() -> Int {\n  var items: Vec[Int] = Vec[Int].new();\n  items.push(1);\n  items.push(2);\n  items.push(3);\n  var sum: Int = 0;\n  for item in items { sum += item; }\n  return sum;\n}`
  };
  document.getElementById('editor').value = examples[name] || examples.hello;
  clearAll();
  updateLineCount();
}

// Init
document.getElementById('editor').addEventListener('click', updateLineCount);
document.getElementById('editor').addEventListener('keyup', updateLineCount);
updateLineCount();
</script>
</body>
</html>
