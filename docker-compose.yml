#
# XIOM Playground -- Docker Compose (Contabo VPS / Portainer ready).
# Hestia nginx terminates TLS and proxies playground.xiom-lang.org to
# 127.0.0.1:3300 (3000 is Gitea on this host).
#
# Sandbox: the playground executes user-submitted programs, so the
# container is locked down. Egress is blocked by the DOCKER-USER guard rule
# applied by scripts/playground-egress-guard.sh (an internal network blocks
# the published port on Docker 28.x, so the guard is the working mechanism).

services:
  playground:
    build: .
    image: xiom-playground:latest
    container_name: xiom-playground
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - /opt/xiom/toolchain:/toolchain:ro
      - playground-data:/data
    # Optional accounts config (C2). The file lives outside the repo so the
    # hourly git reset and the Docker build context never touch it; Compose
    # v2.24+ skips it when absent, keeping the feature inert.
    env_file:
      - path: /opt/xiom/playground.env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - XIOM_BIN=/toolchain/bin/xiom
      - XIOM_STDLIB=/toolchain/lib
      - PLAYGROUND_DATA_DIR=/data
      # The toolchain's script cache needs a writable HOME. The rootfs
      # (including /home/xiomp) is read-only, so without this every program
      # run recompiles (~6s instead of ~10ms warm on repeat runs).
      - HOME=/tmp/xiom-home
    # The C2 auth helper runs on the host and is reached through the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      # exec is required, not optional: the toolchain writes and runs compiled
      # scripts under TMPDIR (default /tmp) and Docker mounts tmpfs with
      # noexec by default, so every program run failed with EACCES until this
      # was added (production incident 2026-09-19).
      - /tmp:size=256m,exec
    mem_limit: 768m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  playground-data:
